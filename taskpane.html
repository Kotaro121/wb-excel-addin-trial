<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WB の図 試作</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  body { font: 13px/1.5 "Segoe UI", Meiryo, sans-serif; margin: 12px; color: #222; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  button { display: block; width: 100%; margin: 6px 0; padding: 8px; font: inherit; border: 1px solid #888; background: #fff; border-radius: 4px; cursor: pointer; }
  button.main { background: #6b4fbb; color: #fff; border-color: #6b4fbb; }
  #log { margin-top: 10px; padding: 0; list-style: none; font-size: 12px; }
  #log li { padding: 3px 0; border-bottom: 1px solid #eee; }
  .ok::before { content: "○ "; color: #1b7f3b; }
  .ng::before { content: "× "; color: #b3261e; }
  .info::before { content: "・ "; color: #666; }
</style>
</head>
<body>
<h1>WB の図 試作</h1>
<button class="main" id="a">A：Excel の機能で図を作る</button>
<button id="b">B：アプリが作った図表のシートを差し込む</button>
<ul id="log"></ul>
<script src="taskpane.js"></script>
</body>
</html>
